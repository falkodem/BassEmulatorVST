[project]
name = "bassemulator-utils"
version = "0.1.0"
description = ""
authors = [
    {name = "Falkodem",email = "dimbatsula@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "soundfile (>=0.13.1,<0.14.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "setuptools (<82)",
    "pesto-pitch (>=2.0.1,<3.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "torch (==2.7.1)",
    "torchaudio (==2.7.1)",
    "onnx (>=1.21.0,<2.0.0)",
    "onnxruntime (>=1.26.0,<2.0.0)"
]

[tool.poetry.group.train.dependencies]
torch       = ">=2.0"
tqdm        = ">=4.0"
tensorboard = ">=2.13"
jupyter = "^1.1.1"
pandas = "^3.0.3"
pytorch-lightning = "^2.6.5"

[tool.poetry.group.docs.dependencies]
markdown    = ">=3.5"
pygments    = ">=2.16"

# Install on Ubuntu with:
#   poetry install --with train
#   poetry install --with docs


[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchaudio = {source = "pytorch-cu126"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode=false
